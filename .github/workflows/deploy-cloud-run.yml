name: Deploy to Cloud Run

on:
  push:
    branches:
      - dev
      # - main  # Disabled for now - only dev with paper trading
  pull_request:
    branches:
      - dev
      # - main  # Disabled for now - only dev with paper trading

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE_NAME_DEV: financemaker-dev
  SERVICE_NAME_PROD: financemaker-prod

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests (if any)
        run: |
          # Add test commands here if you have tests
          echo "No tests configured yet"
        continue-on-error: true
      
      - name: Validate required secrets
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          REGION="${{ secrets.GCP_REGION }}"
          
          if [ -z "$PROJECT_ID" ]; then
            echo "❌ Error: GCP_PROJECT_ID secret is not set or is empty"
            echo "Please ensure GCP_PROJECT_ID is set in the 'dev' environment secrets"
            exit 1
          fi
          if [ -z "$REGION" ]; then
            echo "❌ Error: GCP_REGION secret is not set or is empty"
            echo "Please ensure GCP_REGION is set in the 'dev' environment secrets"
            exit 1
          fi
          echo "✅ GCP_PROJECT_ID is set (length: ${#PROJECT_ID} chars)"
          echo "✅ GCP_REGION is set (length: ${#REGION} chars)"
      
      - name: Build Docker image
        id: build-image
        run: |
          IMAGE_TAG="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/financemaker-repo/financemaker:${{ github.sha }}"
          echo "Building image with tag: $IMAGE_TAG"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          docker build -t $IMAGE_TAG .
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet
      
      - name: Push Docker image
        run: |
          docker push ${{ steps.build-image.outputs.image_tag }}

  deploy-dev:
    needs: build-and-test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Delete existing SERVICE (if exists) - Services and Jobs share namespace
        run: |
          echo "Checking for existing SERVICE with same name (Services and Jobs share namespace)..."
          if gcloud run services describe ${{ env.SERVICE_NAME_DEV }} \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} &>/dev/null; then
            echo "⚠️  SERVICE exists with same name! Deleting it (Services and Jobs share namespace)..."
            gcloud run services delete ${{ env.SERVICE_NAME_DEV }} \
              --region ${{ secrets.GCP_REGION }} \
              --project ${{ secrets.GCP_PROJECT_ID }} \
              --quiet
            echo "Waiting for service deletion..."
            sleep 20
            for i in {1..10}; do
              if ! gcloud run services describe ${{ env.SERVICE_NAME_DEV }} \
                --region ${{ secrets.GCP_REGION }} \
                --project ${{ secrets.GCP_PROJECT_ID }} &>/dev/null; then
                echo "Service deleted. Waiting 10 more seconds..."
                sleep 10
                break
              fi
              sleep 5
            done
          else
            echo "No service exists with that name"
          fi
        continue-on-error: true
      
      - name: Delete existing JOB (if exists)
        run: |
          if gcloud run jobs describe ${{ env.SERVICE_NAME_DEV }} \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} &>/dev/null; then
            echo "Deleting existing job..."
            gcloud run jobs delete ${{ env.SERVICE_NAME_DEV }} \
              --region ${{ secrets.GCP_REGION }} \
              --project ${{ secrets.GCP_PROJECT_ID }} \
              --quiet
            echo "Waiting for job deletion..."
            sleep 20
            for i in {1..10}; do
              if ! gcloud run jobs describe ${{ env.SERVICE_NAME_DEV }} \
                --region ${{ secrets.GCP_REGION }} \
                --project ${{ secrets.GCP_PROJECT_ID }} &>/dev/null; then
                echo "Job deleted. Waiting 10 more seconds..."
                sleep 10
                break
              fi
              sleep 5
            done
          else
            echo "No job exists with that name"
          fi
        continue-on-error: true

      - name: Deploy Cloud Run Job (Dev - Paper Trading)
        run: |
          # Create job WITHOUT mounting secrets (secrets are already mounted)
          echo "Creating job (secrets are already mounted, not setting them in CI/CD)..."
          gcloud run jobs create ${{ env.SERVICE_NAME_DEV }} \
            --image ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/financemaker-repo/financemaker:${{ github.sha }} \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --service-account ${{ secrets.GCP_SA_EMAIL }} \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 3600 \
            --set-env-vars "TRADING_ENV=paper,IBKR_DH_PARAM_PATH=/secrets/dh_param,IBKR_ENCRYPTION_KEY_PATH=/secrets/encryption_key,IBKR_SIGNATURE_KEY_PATH=/secrets/signature_key,GROK_API_KEY=${{ secrets.GROK_API_KEY }},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},IBKR_ACCESS_TOKEN=${{ secrets.IBKR_ACCESS_TOKEN }},IBKR_ACCESS_TOKEN_SECRET=${{ secrets.IBKR_ACCESS_TOKEN_SECRET }},IBKR_CONSUMER_KEY=${{ secrets.IBKR_CONSUMER_KEY }}"
          
          echo "✅ Job created successfully (secrets already mounted)"

      - name: Execute Cloud Run Job (Dev - Paper Trading)
        run: |
          EXECUTION_NAME=$(gcloud run jobs execute ${{ env.SERVICE_NAME_DEV }} \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --wait \
            --format="value(metadata.name)")
          echo "Job execution: $EXECUTION_NAME"
          echo "Fetching logs..."
          gcloud run jobs executions logs read "$EXECUTION_NAME" \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --limit=1000

